<!DOCTYPE html>
<html lang="en"> <!-- All html files have to be "wrapped" with the <html></html> tags -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial</title>
</head>

<body>

    <div> <!-- “Invisible boxes” used to divide a layout into sections visually (boxes) -->

        <h1 id="main_title"> This is a Heading </h1>
        <p class="body_text"> This is a Paragraph </p>
        <a href="about.html"> This is a Link </a>
        <!-- always use https rather than http as the 's' adds security -->

        <!-- img and input are two examples of exceptions -->
        <input> <!-- This doesn't have a closing tag, it's a textbox -->

    </div>

    <img id="main_image" src="images/Trollface.png" width="100" alt="Trololololololololol! :D" />
    <!-- Closing and Opening together for image -->
    <!-- You can use .. to go up a folder   ex) ../images/Trollface.png -->

    <button id="home_confirm" class="confirm small_confirm"> Click Me! </button> <!-- Has two classes -->

</body>

</html>
